<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar Oak · cabina di regia</title>
<!--
  CABINA DI REGIA — tutto quello su cui il cervello ragiona.

  Da Torino si entra, si sceglie l'impianto, e si guarda. Tredici quadri,
  uno per dominio, che leggono le viste vere della piattaforma. Nessun
  numero e' calcolato qui dentro: qui si disegna soltanto.

  Regola che vale ovunque: se un dato non c'e', si scrive che non c'e' e
  si dice cosa serve per averlo. Una schermata vuota che sembra piena e'
  peggio di nessuna schermata.
-->
<style>
:root{--sfondo:#0b0f14;--pannello:#141a22;--bordo:#232c38;--testo:#e6edf3;
 --tenue:#7d8896;--oak:#4ea87b;--oak-forte:#6fd3a0;--oak-tenue:#16301f;
 --warn:#d99a2b;--bad:#d9534f;--acqua:#3f8fd9;--viola:#8b7bd8;--vetro:#2a4a6a;
 --oro:#c9a227}
*{box-sizing:border-box}
body{margin:0;background:var(--sfondo);color:var(--testo);
 font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1{font-size:15px;margin:0;font-weight:600}
h2{font-size:10.5px;margin:0 0 9px;color:var(--tenue);font-weight:700;
 text-transform:uppercase;letter-spacing:1px}
h3{font-size:13px;margin:0 0 6px;font-weight:600}
a{color:var(--acqua)}
input,select,button{background:var(--pannello);color:var(--testo);
 border:1px solid var(--bordo);border-radius:7px;padding:6px 10px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--oak)}
button.primo{background:var(--oak);color:#08120c;border-color:var(--oak);font-weight:600}
button.sel{border-color:var(--oak);color:var(--oak-forte)}
#login{max-width:340px;margin:14vh auto;padding:26px;background:var(--pannello);
 border:1px solid var(--bordo);border-radius:13px}
#login input{width:100%;margin:6px 0}
.err{color:var(--bad);font-size:13px;margin:8px 0}
.marchio{width:26px;height:26px;border-radius:7px;background:var(--oak);
 display:grid;place-items:center;font-weight:700;color:#08120c;font-size:13px;flex:none}

/* ── struttura ───────────────────────────────────────────── */
.testa{display:flex;align-items:center;gap:12px;padding:9px 16px;
 border-bottom:1px solid var(--bordo);background:#0e141b;flex-wrap:wrap}
.polso{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.p{text-align:right}
.p b{font-size:15px;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.p span{font-size:9.5px;color:var(--tenue);text-transform:uppercase;letter-spacing:.6px}
.avviso{padding:7px 16px;background:#2a2114;border-bottom:1px solid #4a3a1c;
 color:#e8c88a;font-size:12.5px}
.corpo{display:grid;grid-template-columns:186px 1fr;min-height:calc(100vh - 96px)}
@media(max-width:900px){.corpo{grid-template-columns:1fr}}
.nav{border-right:1px solid var(--bordo);background:#0e141b;padding:8px 0;
 overflow-y:auto}
.voce{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;
 font-size:13px;border-left:3px solid transparent;color:var(--tenue)}
.voce:hover{background:#131b24;color:var(--testo)}
.voce.on{border-left-color:var(--oak);color:var(--testo);background:#101a15}
.voce .ico{width:16px;text-align:center;flex:none;font-size:13px}
.voce .n{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:9px;
 background:#1c2530;font-variant-numeric:tabular-nums}
.voce .n.male{background:#3a1c1b;color:var(--bad)}
.voce .n.attenzione{background:#3a2f14;color:var(--warn)}
.gruppo{font-size:9.5px;color:#4b5563;text-transform:uppercase;letter-spacing:1px;
 padding:12px 14px 4px;font-weight:700}
.quadro{padding:14px;overflow-x:hidden}
.griglia{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.griglia.due{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--pannello);border:1px solid var(--bordo);border-radius:10px;padding:12px}
.card.largo{grid-column:1/-1}

/* ── contenuti ───────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--tenue);font-weight:600;font-size:10.5px;
 text-transform:uppercase;letter-spacing:.6px;padding:5px 8px 5px 0;
 border-bottom:1px solid var(--bordo);white-space:nowrap}
td{padding:6px 8px 6px 0;border-bottom:1px solid #171f28;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#101720}
.pill{font-size:10.5px;padding:2px 7px;border-radius:20px;background:#1c2530;
 color:var(--tenue);white-space:nowrap}
.pill.ok{background:var(--oak-tenue);color:var(--oak-forte)}
.pill.male{background:#3a1c1b;color:var(--bad)}
.pill.attenzione{background:#3a2f14;color:var(--warn)}
.pill.info{background:#152736;color:var(--acqua)}
.vuoto{color:var(--tenue);font-size:12.5px;padding:10px 0;line-height:1.6}
.vuoto b{color:var(--warn)}
.kpi{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.kpi div{min-width:88px}
.kpi b{font-size:20px;display:block;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:10px;color:var(--tenue);text-transform:uppercase;letter-spacing:.6px}
.barra{height:7px;background:#1a222c;border-radius:4px;overflow:hidden;margin:3px 0}
.barra i{display:block;height:100%;border-radius:4px}
.nota{font-size:11px;color:var(--tenue);line-height:1.55;margin-top:9px}
.riga{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.riga span:first-child{width:104px;color:var(--tenue);flex:none}
.riga b{margin-left:auto;font-variant-numeric:tabular-nums}
.sparkline{width:100%;height:44px;display:block}

/* ── quadro CAMPO ────────────────────────────────────────── */
.campo-tela{display:grid;grid-template-columns:1fr 340px;gap:12px}
@media(max-width:1300px){.campo-tela{grid-template-columns:1fr}}
.mappa svg,.fianco svg{width:100%;display:block;background:#080c11;border-radius:8px}
.dice{padding:8px 12px;background:#0e141b;border-radius:8px;margin-top:8px;
 font-size:13.5px;display:flex;gap:12px;align-items:baseline;border:1px solid var(--bordo)}
.dice b{color:var(--oak-forte)}
.dice .q{color:var(--tenue);font-size:12px;margin-left:auto;white-space:nowrap}
.tempo{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.tempo input[type=range]{flex:1;min-width:130px;accent-color:var(--oak)}
.ora{font-variant-numeric:tabular-nums;color:var(--tenue);font-size:12.5px;min-width:58px}
.legenda{display:flex;gap:11px;flex-wrap:wrap;padding:6px 0;font-size:11px;color:var(--tenue)}
.leg{display:flex;align-items:center;gap:5px}
.q{width:11px;height:11px;border-radius:3px}
.rover{border:1px solid var(--bordo);border-radius:9px;padding:10px;margin-bottom:9px;background:#101720}
.rover.attivo{border-color:var(--oak);background:#0f1d16}
.rtesta{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.carico{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:11.5px}
.carico span:first-child{width:62px;color:var(--tenue);flex:none}
.carico .barra{flex:1;margin:0}
.carico b{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px}
.decisione{border-left:3px solid var(--viola);background:#131020;padding:9px 11px;
 border-radius:0 8px 8px 0;margin-bottom:8px}
.decisione .k{font-weight:600;font-size:12.5px}
.decisione .s{font-size:11.5px;color:#bfb3e0;margin-top:5px;padding-top:5px;border-top:1px solid #2a2338}
.giud{display:flex;gap:5px;margin-top:8px}
.giud button{padding:3px 8px;font-size:11px;flex:1}
.giud button.si{border-color:var(--oak);color:var(--oak)}
.giud button.no{border-color:var(--bad);color:var(--bad)}
.giud button.forse{border-color:var(--warn);color:var(--warn)}
.evento{font-size:11.5px;padding:3px 0;border-bottom:1px solid #171f28;display:flex;gap:8px}
.evento b{color:var(--tenue);font-variant-numeric:tabular-nums;min-width:40px;font-weight:500}

/* ── media ───────────────────────────────────────────────── */
.provini{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.provino{border:1px solid var(--bordo);border-radius:9px;overflow:hidden;background:#101720}
.provino .schermo{aspect-ratio:16/10;background:#080c11;display:grid;place-items:center;
 color:var(--tenue);font-size:11.5px;text-align:center;padding:8px;cursor:pointer}
.provino .schermo img,.provino .schermo video{width:100%;height:100%;object-fit:cover}
.provino .sotto{padding:7px 9px;font-size:11.5px}
.provino .sotto .t{color:var(--tenue);font-size:10.5px;font-variant-numeric:tabular-nums}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes arrivata{0%{background:#1d4a30}60%{background:#16351f}100%{background:transparent}}
tr.nuova{animation:arrivata 4s ease-out}
tr.nuova td:first-child{box-shadow:inset 3px 0 0 #5ad07a}
</style>

</div>

async function entra(){
  $('#loginErr').innerHTML='';
  try{
    const r = await fetch(URL_BASE+'/auth/v1/token?grant_type=password',{method:'POST',
      headers:{'apikey':CHIAVE,'Content-Type':'application/json'},
      body:JSON.stringify({email:$('#email').value.trim(),password:$('#pwd').value})});
    const j = await r.json();
    if(!r.ok||!j.access_token){
      /* Supabase risponde in inglese: «Invalid login credentials». In una
         sala di controllo italiana quel messaggio non aiuta nessuno. */
      const m = (j.error_description||j.msg||j.error||'').toLowerCase();
      throw new Error(
        /invalid login/.test(m)      ? 'Email o password sbagliate.' :
        /email not confirmed/.test(m)? 'Questo accesso non è ancora confermato.' :
        /too many/.test(m)           ? 'Troppi tentativi: aspetta qualche minuto.' :
        /network|failed to fetch/.test(m) ? 'Non riesco a raggiungere la piattaforma.' :
        (j.error_description||j.msg||'Accesso non riuscito'));
    }
    token=j.access_token; refresh=j.refresh_token||null;
    scadenza = Date.now() + (j.expires_in||3600)*1000;
    $('#pwd').value='';
    const p = await get('v_mio_profilo');
    if(!p.length) throw new Error('Accesso non associato a un profilo.');
    profilo=p[0];
    siti = await get('v_selettore_siti');
    if(!siti.length) throw new Error('Nessun impianto associato a questo accesso.');
    sito = siti[0].site_id;
    $('#login').style.display='none'; $('#app').style.display='block';
    disegnaSelettore(); disegnaNav();
    await carica(); requestAnimationFrame(giro); avviaDiretta();
  }catch(e){
    /* ⚠️ La password si cancella ANCHE quando l'accesso fallisce.
       Prima restava nel campo: chi si alzava dopo un tentativo sbagliato
       la lasciava lì, in chiaro nel DOM, su uno schermo di sala controllo. */
    $('#pwd').value='';
    $('#loginErr').innerHTML='<div class="err">'+esc(e.message)+'</div>';
  }
}

/* ═══════════════════════════════════════════════════════════════════
   🔴 DIFETTO GRAVE, trovato il 6 agosto 2026 rileggendo la cabina.

   Questa funzione faceva:   return r.ok ? r.json() : [];

   Cioè: se il database rispondeva 401, 500, o se la rete cadeva, tornava
   **una lista vuota** — indistinguibile da «qui non c'è niente». Il quadro
   si disegnava vuoto e chi guardava pensava che l'impianto non avesse dati.

   È esattamente il difetto contro cui abbiamo lavorato tutto il giorno: un
   buco che si traveste da risposta. E con il respiro ogni cinque secondi
   sarebbe stato peggio, perché la cabina si sarebbe svuotata da sola senza
   dire niente.

   ⭐ Ora un errore è un ERRORE: si conta, si mostra in cima, e la fascia
      diventa rossa. Il vuoto resta vuoto solo quando è davvero vuoto.
   ═══════════════════════════════════════════════════════════════════ */
let guastiRete = [], ultimoGuasto = 0;

async function get(v,q=''){
  let r;
  try{
    r = await fetch(URL_BASE+'/rest/v1/'+v+'?select=*'+q,
      {headers:{'apikey':CHIAVE,'Authorization':'Bearer '+token}});
  }catch(e){
    segnalaGuasto(v, 'rete irraggiungibile');
    return [];
  }
  if(r.status===401 || r.status===403){
    /* il gettone è scaduto: si prova a rinnovarlo UNA volta, e se non si
       riesce si torna alla schermata d'accesso invece di mostrare il vuoto */
    if(await rinnovaSessione()) return get(v,q);
    segnalaGuasto(v, 'sessione scaduta');
    return [];
  }
  if(!r.ok){ segnalaGuasto(v, 'il database ha risposto '+r.status); return []; }
  try{
    const dati = await r.json();
    if(guastiRete.some(g=>g.vista===v)){
      guastiRete = guastiRete.filter(g=>g.vista!==v);
      disegnaGuasti();
    }
    return dati;
  }
  catch(e){ segnalaGuasto(v, 'risposta illeggibile'); return []; }
}

function segnalaGuasto(vista, perche){
  ultimoGuasto = Date.now();
  guastiRete = guastiRete.filter(g=>g.vista!==vista);
  guastiRete.push({vista, perche, quando: new Date()});
  if(guastiRete.length > 12) guastiRete.shift();
  disegnaGuasti();
}

function disegnaGuasti(){
  let f = document.getElementById('guasti');
  if(!f){ f=document.createElement('div'); f.id='guasti';
          $('#app').insertBefore(f, $('#app').firstChild); }
  /* i guasti vecchi di più di un minuto si dimenticano: se la rete è
     tornata, la fascia deve sparire da sola */
  guastiRete = guastiRete.filter(g=>Date.now()-g.quando.getTime() < 60000);
  if(!guastiRete.length){ f.style.display='none'; return; }
  f.style.cssText='display:block;border:1px solid #7a2a22;background:#3a1614;'
    +'border-radius:6px;padding:9px 13px;margin:0 0 10px;font-size:12.5px;line-height:1.5';
  f.innerHTML = `<b style="color:#e07a6a">🔴 NON RIESCO A LEGGERE ${guastiRete.length}`
    + ` ${guastiRete.length===1?'vista':'viste'}</b>`
    + `<div style="color:var(--ink-2);margin-top:3px">`
    + guastiRete.map(g=>`<code>${esc(g.vista)}</code> — ${esc(g.perche)}`).join(' · ')
    + `<br>⚠️ <b>Quello che vedi potrebbe essere incompleto.</b> Un quadro vuoto qui `
    + `non vuol dire «non c'è niente»: vuol dire «non sono riuscito a chiedere».</div>`;
}

/* ═══ 🔴 2 · la sessione non si rinnovava mai ═══════════════════════
   Il gettone di Supabase dura un'ora. Una sala di controllo la si lascia
   aperta tutta la notte: dopo sessanta minuti ogni vista tornava vuota,
   la barra diceva «Nessun robot in campo» e sembrava che l'impianto si
   fosse fermato. Il modo peggiore di rompersi: in silenzio, sembrando
   una notizia. */
async function rinnovaSessione(){
  if(!refresh) return false;
  try{
    const r = await fetch(URL_BASE+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST', headers:{'apikey':CHIAVE,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: refresh})});
    const j = await r.json();
    if(!r.ok || !j.access_token) throw new Error('rinnovo rifiutato');
    token = j.access_token;
    if(j.refresh_token) refresh = j.refresh_token;
    scadenza = Date.now() + (j.expires_in||3600)*1000;
    return true;
  }catch(e){ return false; }
}
/* le viste che hanno site_id si filtrano; le altre no */
const perSito = (v,q='') => get(v,'&site_id=eq.'+encodeURIComponent(sito)+q);
async function rpc(n,a){ const r=await fetch(URL_BASE+'/rest/v1/rpc/'+n,{method:'POST',
  headers:{'apikey':CHIAVE,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
  body:JSON.stringify(a)}); return r.json(); }
/* una URL firmata a scadenza breve: un link copiato non vale per sempre */
async function firma(bucket, percorso, secondi=300){
  const r = await fetch(URL_BASE+'/storage/v1/object/sign/'+bucket+'/'+percorso,
    {method:'POST', headers:{'apikey':CHIAVE,'Authorization':'Bearer '+token,
     'Content-Type':'application/json'}, body:JSON.stringify({expiresIn:secondi})});
  if(!r.ok) return null;
  const j = await r.json();
  return j.signedURL ? URL_BASE+'/storage/v1'+j.signedURL : null;
}

/* ⭐⭐ SCRIVERE SOLO SE È CAMBIATO — la regola di tutta la cabina.
   Il 7 agosto 2026 ILE: «continua a sfarfallare». Il primo colpevole
   (la barra della diretta) era vero ma non bastava: ogni cinque secondi
   `carica()` riscriveva navigazione, striscia dei numeri e fasce, e
   soprattutto chiamava `disegnaQuadro()` in modo NON silenzioso — che
   come prima cosa **svuota il pannello** e poi lo ridisegna.
   Cioè: tutto lo schermo lampeggiava ogni cinque secondi.

   `carica()` era scritta per il primo caricamento e per il cambio sito,
   dove svuotare va benissimo. Il respiro la riusava tale e quale.

   Questa funzioncina è la disciplina, in un posto solo: assegnare
   l'HTML distrugge e ricrea gli elementi — animazioni, selezione del
   testo, posizione del cursore. Se il contenuto è identico, non si tocca. */
function scriviSeCambia(el, html){
  if(!el || el.innerHTML === html) return false;
  el.innerHTML = html; return true;
}

function disegnaSelettore(){

  if(el && el.value !== sito) el.value = sito;
}
async function cambiaSito(s){ sito=s; for(const k in cache) delete cache[k]; await carica(); }

/* Quali quadri hanno qualcosa da dire su QUESTO impianto. I conteggi
   arrivano gia' tutti da v_i_miei_siti: nessuna interrogazione in piu'.
   Serve a non far cliccare su un quadro vuoto per scoprire che e' vuoto. */

/* ══ carica ════════════════════════════════════════════════
   `silenzioso` distingue il PRIMO caricamento (o un cambio sito) dal
   RESPIRO periodico. Sembra un dettaglio ed era
   la causa dello sfarfallio: in modo non silenzioso `disegnaQuadro`
   comincia svuotando il pannello, e a ogni respiro tutto lo schermo
   lampeggiava. Chi guarda una sala di controllo ci sta davanti per ore. */
function riassumiMappa(righe){
  const giorni = righe.map(x=>N(x.giorni_da_pulizia)).filter(Number.isFinite);
  const conta = (...stati) => righe.filter(x=>stati.includes(x.stato)).length;
  return {
    site_id:sito, filari:righe.length,
    m2_totali:righe.reduce((n,x)=>n+(N(x.m2)||0),0),
    filari_puliti:conta('pulito ieri','pulito'),
    filari_da_fare:conta('da rifare','sporco'),
    filari_mai_fatti:conta('mai pulito'),
    filari_con_difetti:righe.filter(x=>N(x.difetti_aperti)>0).length,
    difetti_aperti:righe.reduce((n,x)=>n+(N(x.difetti_aperti)||0),0),
    filari_stanotte:righe.filter(x=>x.nel_piano_stanotte).length,
    giorni_medi_da_pulizia:giorni.length
      ? Math.round(giorni.reduce((n,x)=>n+x,0)/giorni.length*10)/10 : null,
    peggiore_giorni:giorni.length ? Math.max(...giorni) : null
  };
}

async function carica(silenzioso=false){
  /* La scheda e l'origine cambiano solo al primo caricamento/cambio sito.
     Il polso, invece, e' lo stesso riepilogo della mappa gia' scaricata.
     Al primo giro scheda e mappa si leggono in sequenza: insieme saturavano
     il database gratuito e una delle due scadeva prima di rispondere. */
  let sc=[schedaSito], og=origine;
  if(!silenzioso) [sc,og] = await Promise.all([
    perSito('v_i_miei_siti'), perSito('v_origine_dati')]);
  const [m,r,d,bt,sa] = await Promise.all([
    perSito('v_mappa_impianto','&order=y0'),
    perSito('v_robot_stato','&order=robot_id'),
    perSito('v_registro_decisioni','&order=ts.desc&limit=8'),
    get('v_battito_piattaforma'), get('v_salute_piattaforma')]);
  mappa = m.map(f=>({...f, y0:N(f.y0), lunghezza_m:N(f.lunghezza_m), m2:N(f.m2),
                     difetti_aperti:N(f.difetti_aperti)||0}));
  polso=riassumiMappa(mappa); rover=r; decisioni=d; schedaSito=sc[0]||{}; origine=og||[]; lavoriAuto=bt||[]; salute=(sa||[])[0]||{};
  const bersagli = mappa.filter(f=>f.nel_piano_stanotte);
  const dove = (bersagli.length?bersagli:mappa);
  filaDi = {};
  [...new Set(TR.fila.filter(Boolean))].forEach((f,i)=>{ if(dove[i]) filaDi[f]=dove[i].filare_id; });

  disegnaSalute(); disegnaBanco(); disegnaPolso(); disegnaAvviso(); disegnaNav();
  await disegnaQuadro(silenzioso);
  aggiornaBadge();
}

function disegnaPolso(){
  const p=polso, s=schedaSito;
  if(!mappa.length){
    scriviSeCambia($('#polso'), `
      <div class="p"><b>${num(s.letture_produzione)}</b><span>letture prod.</span></div>
      <div class="p"><b>${num(s.giorni_pr)}</b><span>giorni PR</span></div>
      <div class="p"><b>${num(s.robot)}</b><span>robot</span></div>
      <div class="p"><b style="color:var(--warn)">${num(s.cosa_manca?s.cosa_manca.length:0)}</b><span>dati mancanti</span></div>`);
    return;
  }
  scriviSeCambia($('#polso'), `
    <div class="p"><b>${num(p.filari)}</b><span>filari</span></div>
    <div class="p"><b>${num(p.m2_totali)}</b><span>m² vetro</span></div>
    <div class="p"><b style="color:var(--oak)">${num(p.filari_puliti)}</b><span>puliti</span></div>
    <div class="p"><b style="color:${N(p.filari_da_fare)>0?'var(--warn)':'var(--testo)'}">${num(p.filari_da_fare)}</b><span>da fare</span></div>
    <div class="p"><b style="color:${N(p.difetti_aperti)>0?'var(--bad)':'var(--testo)'}">${num(p.difetti_aperti)}</b><span>difetti</span></div>
    <div class="p"><b>${num(p.giorni_medi_da_pulizia,1)}</b><span>gg medi</span></div>`);
}


/* ═══════════════════════════════════════════════════════════════════
   LA DIRETTA
   Una sala di controllo non è una pagina da ricaricare: è un posto dove
   guardi e le cose si muovono. Ogni secondo si legge il battito del robot;
   se smette di battere, la barra diventa rossa e lo dice — perché il
   silenzio è un dato, non un'assenza di dati.
   ═══════════════════════════════════════════════════════════════════ */
let vivi=[], ultimoBattito=0, filoDiretta=null, tickDiretta=null;
let lavoriAuto=[], salute={};

let filoRespiro=null, ultimeNuove=0, respiroInCorso=false;

function avviaDiretta(){
  [filoDiretta,tickDiretta,filoRespiro].forEach(f=>f&&clearInterval(f));
  battito();
  filoDiretta = setInterval(battito, 1000);        // il polso: ogni secondo
  tickDiretta = setInterval(disegnaDiretta, 250);  // l'orologio scorre liscio
  /* ⭐ il respiro: ogni quindici secondi il quadro che stai guardando si
     rilegge da solo. Non si ricarica la pagina, non si perde lo scorrimento,
     e le righe nuove lampeggiano. */
  filoRespiro = setInterval(respira, 15000);
}

async function respira(){
  if(document.hidden || respiroInCorso) return;
  respiroInCorso=true;
  /* ⭐ silenzioso: `carica` ridisegna gia' il quadro, e lo fa senza
     svuotarlo prima. Il doppio disegno di prima era anche uno spreco:
     ogni respiro costruiva il quadro due volte. */
  try{ await carica(true); }catch(e){}
  finally{ respiroInCorso=false; }
}

function segnaRespiro(nuove){
  ultimoRitocco = Date.now();
  if(nuove) ultimeNuove = nuove;
  const t = document.getElementById('respiro');
  if(t) t.textContent = nuove ? `+${nuove} righe nuove` : 'aggiornato ora';
}

async function battito(){
  /* ⭐ si rinnova cinque minuti PRIMA della scadenza: aspettare il 401
     vorrebbe dire mostrare almeno un giro di dati vuoti. */
  if(scadenza && Date.now() > scadenza - 300000) await rinnovaSessione();
  try{
    const r = await perSito('v_robot_vivo');
    vivi = r||[]; ultimoBattito = Date.now();
    disegnaDiretta();
    if(quadro==='campo') muoviRobotVivi();
  }catch(e){ /* la rete cade: la barra lo mostrerà da sola */ }
}

/* 🔴 Il 7 agosto 2026 ILE ha aperto la cabina e ha scritto: «la pagina
   sfarfalla in continuazione». Aveva ragione, ed era qui.

   Questa funzione gira **quattro volte al secondo** — serve, perché il
   contatore «battito N s fa» deve scorrere liscio. Ma riscriveva ogni
   volta l'`innerHTML` di tutta la barra, anche quando non era cambiato
   niente. Riscrivere l'HTML distrugge e ricrea gli elementi: il pallino
   verde ha `animation:pulsa 1.4s`, e l'animazione **ripartiva da capo
   quattro volte al secondo**. Da lontano è uno sfarfallio; da vicino è
   una sala di controllo che non sta ferma mentre la guardi per ore.

   ⭐ La cura è la stessa già usata per i quadri: si tocca il DOM solo se
      il contenuto è cambiato davvero. L'unica cosa che cambia a ogni
      colpo — i secondi dall'ultimo battito — vive in un suo `<span>` e
      si aggiorna con `textContent`, che non ricrea niente. */
let improntaDiretta = '';

function disegnaDiretta(){
  let b = document.getElementById('diretta');
  if(!b){ b=document.createElement('div'); b.id='diretta';
          $('#app').insertBefore(b, $('#app').firstChild); improntaDiretta=''; }
  const eta = (Date.now()-ultimoBattito)/1000;

  /* l'orologio scorre da solo, senza rifare la barra */
  const orol = document.getElementById('etaBattito');
  if(orol) orol.textContent = eta<2 ? 'ora' : eta.toFixed(0)+' s fa';

  const r = vivi[0];
  if(!vivi.length){
    const impronta = 'vuoto';
    if(impronta === improntaDiretta) return;
    improntaDiretta = impronta;
    b.style.cssText='display:block;background:var(--pannello);border:1px solid var(--linea);'
      +'border-radius:6px;padding:8px 13px;margin:0 0 10px;font-size:12.5px';
    b.innerHTML = `<span style="opacity:.5">⚪</span> <b>Nessun robot in campo</b>`
      + ` <span style="color:var(--ink-2)">— quando un robot inizia a battere, compare qui</span>`;
    return;
  }
  const muti = vivi.filter(x=>N(x.muto_da_s)>60).length;
  const rosso = muti>0 || vivi.some(x=>x.allarme);
  const punto = rosso
    ? `<span style="color:#e07a6a">●</span>`
    : `<span style="color:#5ad07a;animation:pulsa 1.4s infinite">●</span>`;
  const corpo = punto + ` <b style="color:${rosso?'#e07a6a':'#5ad07a'}">`
    + (rosso?'ATTENZIONE':'IN DIRETTA') + `</b> `
    /* ⭐ i secondi stanno in un loro span: si aggiornano da soli, e la
       barra attorno non viene ricostruita */
    + `<span style="color:var(--ink-2)">· battito <span id="etaBattito">`
    + (eta<2?'ora':eta.toFixed(0)+' s fa') + `</span>`
    + ` · quadro <span id="respiro">aggiornato ora</span></span>`
    + `<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px">`
    + vivi.map(x=>{
        const m=N(x.muto_da_s);
        return `<div style="min-width:230px">
          <b>${esc(x.robot_id)}</b> ${esc(x.semaforo||'')}
          ${x.filare_id?` · fila <b>${esc(x.filare_id)}</b>`:''}
          ${x.avanz_pct!=null?` ${num(x.avanz_pct,0)}%`:''}
          <div style="color:var(--ink-2);font-size:11.5px">
            ${x.batteria_pct!=null?`🔋 ${num(x.batteria_pct,0)}%`:''}
            ${x.acqua_l!=null?` · 💧 ${num(x.acqua_l,0)} L`:''}
            ${x.forza_n!=null?` · ${num(x.forza_n,0)} N`:''}
            ${x.v_ms!=null?` · ${num(x.v_ms,2)} m/s`:''}
            ${x.m2_stanotte!=null?` · ${num(x.m2_stanotte,0)} m² stanotte`:''}
          </div>
          ${x.allarme?`<div style="color:#e07a6a">🔴 ${esc(x.allarme)}</div>`:''}
        </div>`;}).join('')
    + `</div>`;

  /* ⭐ L'impronta si costruisce sui campi STABILI, non sull'HTML.
     Nell'HTML ci sono i secondi che scorrono (`etaBattito`, e dentro
     `semaforo` frasi come «silenzio da 12 s»): usarlo come impronta
     vorrebbe dire ricostruire la barra a ogni colpo — cioe' il difetto
     di prima con sopra un controllo che non serve a niente.
     Il tempo che passa si vede dal contatore in cima, che si aggiorna
     da solo; qui contano i FATTI: chi c'e', dove sta, come sta.

     ⚠️ Una sola eccezione, voluta: quando un robot sta zitto da piu' di
        15 secondi il suo semaforo diventa un conto alla rovescia
        («silenzio da 23 s»), e quello DEVE restare vero. Allora entra
        nell'impronta e la barra si rifa' ogni secondo: in stato d'allarme
        un po' di movimento e' giusto che attiri l'occhio. Da fermi, no. */
  const impronta = JSON.stringify([rosso, vivi.map(x=>[
      x.robot_id, x.stato||'', x.filare_id||'',
      N(x.muto_da_s)>15 ? (x.semaforo||'') : '',
      x.avanz_pct==null?null:Math.round(x.avanz_pct),
      x.batteria_pct==null?null:Math.round(x.batteria_pct),
      x.acqua_l==null?null:Math.round(x.acqua_l),
      x.forza_n==null?null:Math.round(x.forza_n),
      x.v_ms==null?null:Number(x.v_ms).toFixed(2),
      x.m2_stanotte==null?null:Math.round(x.m2_stanotte),
      x.allarme||'', N(x.muto_da_s)>60])]);
  if(impronta === improntaDiretta) return;
  improntaDiretta = impronta;
  b.style.cssText='display:block;border-radius:6px;padding:9px 13px;margin:0 0 10px;'
    +'font-size:12.5px;line-height:1.55;border:1px solid '
    +(rosso?'#7a2a22':'#2a5a3a')+';background:'+(rosso?'#3a1614':'#12281c');
  b.innerHTML = corpo;
}

/* il robot si muove sulla mappa, adesso */
function muoviRobotVivi(){
  const svg = document.querySelector('#campoSvg'); if(!svg) return;
  vivi.forEach(r=>{
    if(r.x_m==null||r.y_m==null) return;
    let g = svg.querySelector('#vivo-'+CSS.escape(r.robot_id));
    if(!g){
      g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.id = 'vivo-'+r.robot_id;
      g.innerHTML = `<circle r="7" fill="#5ad07a" opacity=".25"><animate attributeName="r"
          values="7;14;7" dur="1.6s" repeatCount="indefinite"/></circle>
        <circle r="4" fill="#5ad07a"/>
        <text y="-11" text-anchor="middle" font-size="9" fill="#5ad07a">${esc(r.robot_id)}</text>`;
      svg.appendChild(g);
    }
    /* PX viene da disegnaCampo: px(y) è l'asse dei filari, py(x) la
       posizione lungo il filare. Se la mappa non è ancora disegnata,
       non si inventa una posizione: non si disegna il robot. */
    if(!PX || !PX.px) return;
    const cx = PX.px(N(r.y_m)), cy = PX.py(N(r.x_m));
    if(!isFinite(cx) || !isFinite(cy)) return;
    g.setAttribute('transform', `translate(${cx},${cy})`);
    g.style.transition = 'transform .9s linear';
    const vivo = N(r.muto_da_s) < 30;
    g.querySelectorAll('circle,text').forEach(e=>
      e.setAttribute('fill', vivo?'#5ad07a':'#e07a6a'));
  });
}


/* ⭐ IL POLSO DELLA PIATTAFORMA, in cima.
   Il 6 agosto 2026 si è scoperto che l'anello dell'apprendimento non aveva
   MAI girato: falliva ogni mattina alle 6:00 da due giorni, e nessuno lo
   sapeva perché niente guardava cron.job_run_details. Un sistema che non sa
   che i suoi lavori automatici falliscono non è automatico: è rotto e basta. */
function disegnaSalute(){
  let f = document.getElementById('salute');
  if(!f){ f=document.createElement('div'); f.id='salute';
          $('#app').insertBefore(f, $('#app').firstChild); }
  if(!salute.avviso || N(salute.rotti)===0 && N(salute.da_guardare)===0){
    f.style.display='none'; return; }
  const rosso = N(salute.rotti)>0;
  f.style.cssText='display:block;border-radius:6px;padding:9px 13px;margin:0 0 10px;'
    +'font-size:12.5px;line-height:1.5;border:1px solid '+(rosso?'#7a2a22':'#7a5a22')
    +';background:'+(rosso?'#3a1614':'#3a2a12');
  scriviSeCambia(f, `<b style="color:${rosso?'#e07a6a':'#e8b95a'}">${esc(salute.avviso)}</b>`
    + `<div style="color:var(--ink-2);margin-top:3px">${esc(salute.quali||'')}</div>`);
}

function disegnaBanco(){
  /* ⭐ Se il sito e' un teatro di validazione, chi guarda deve saperlo PRIMA
     di leggere un numero — non dopo, e non cercandolo. La fascia sta sopra a
     tutto, in ogni quadro, e non si puo' chiudere. */
  let f = document.getElementById('banco');
  if(!f){ f=document.createElement('div'); f.id='banco';
          $('#app').insertBefore(f, $('#app').firstChild); }
  const o = origine[0]||{};
  if((o.modo||schedaSito.modo) !== 'banco'){ f.style.display='none'; return; }
  const sim = origine.filter(x=>x.origine==='simulato').reduce((a,x)=>a+N(x.n),0);
  const rea = origine.filter(x=>x.origine==='reale').reduce((a,x)=>a+N(x.n),0);
  f.style.display='block';

/* ══ il router dei quadri ══════════════════════════════════ */
let improntaQuadro='', ultimoRitocco=0;

async function disegnaQuadro(silenzioso=false){
  const q=$('#quadro');
  if(!silenzioso) q.innerHTML = '<div class="vuoto">…</div>';
  try{
    const html = await ({
      campo:qCampo, flotta:qFlotta, camere:qCamere, termico:qTermico,
      energia:qEnergia, sporco:qSporco, moduli:qModuli, meteo:qMeteo,
      missioni:qMissioni, allarmi:qAllarmi, garanzia:qGaranzia,
      cervello:qCervello, qualita:qQualita
    }[quadro] || (()=> '<div class="vuoto">quadro sconosciuto</div>'))();

    /* ⭐ DIRETTA PROFONDA: si ridisegna SOLO se qualcosa e' cambiato.
       Ridisegnare ogni cinque secondi comunque farebbe saltare la pagina e
       chi guarda perderebbe il segno — in una sala di controllo si sta
       davanti allo schermo per ore. */
    const impronta = html.length + '|' + html.slice(0, 4000);
    if(silenzioso && impronta === improntaQuadro){ segnaRespiro(); return; }
    const scorrimento = window.scrollY;
    const prima = silenzioso ? chiaviVisibili(q) : new Set();
    improntaQuadro = impronta;
    q.innerHTML = html;
    if(quadro==='campo'){ disegnaCampo(); mostra(k); if(vivi.length) muoviRobotVivi(); }
    if(silenzioso){ window.scrollTo(0, scorrimento); accendiNuove(q, prima); }
    segnaRespiro();
  }catch(e){
    q.innerHTML = `<div class="card"><div class="vuoto">Non sono riuscito a
      disegnare questo quadro: <b>${esc(e.message)}</b>.<br>
      È un difetto mio, non un dato mancante — va segnalato.</div></div>`;
  }
}

/* aiuti per le tabelle */
function tabella(righe, colonne, vuoto){
  if(!righe.length) return `<div class="vuoto">${vuoto||'Niente da mostrare.'}</div>`;
  /* ogni riga porta la sua chiave: serve a riconoscere quelle NUOVE al
     giro dopo, e a farle lampeggiare invece di comparire di soppiatto */
  const chiave = r => esc(String(r.mission_id||r.scan_id||r.filare_id||r.module_id
      ||r.robot_id||r.incident_id||r.decision_id||r.day||r.giorno||r.ts||r.lavoro
      ||JSON.stringify(r).slice(0,60)));
  return `<table><thead><tr>${colonne.map(c=>
      `<th class="${c.n?'n':''}">${esc(c.t)}</th>`).join('')}</tr></thead><tbody>`
    + righe.map(r=>`<tr data-k="${chiave(r)}">${colonne.map(c=>
      `<td class="${c.n?'n':''}">${c.v(r)}</td>`).join('')}</tr>`).join('')
    + '</tbody></table>';
}

function chiaviVisibili(dove){
  /* difensiva: se non c'e' un DOM interrogabile si torna un insieme vuoto
     invece di esplodere. Il respiro non deve mai poter rompere la cabina. */
  if(!dove || typeof dove.querySelectorAll !== 'function') return new Set();
  return new Set([...dove.querySelectorAll('tr[data-k]')].map(
    t => (t.dataset ? t.dataset.k : (t.getAttribute && t.getAttribute('data-k'))) ));
}
function accendiNuove(dove, prima){
  if(!prima || !prima.size) return;
  if(!dove || typeof dove.querySelectorAll !== 'function') return;
  let n=0;
  dove.querySelectorAll('tr[data-k]').forEach(t=>{
    if(!prima.has(t.dataset.k)){ t.classList.add('nuova'); n++;
      setTimeout(()=>t.classList.remove('nuova'), 4000); }
  });
  if(n) segnaRespiro(n);
}
function manca(cosa, serve){
  return `<div class="vuoto">Non c'è <b>${esc(cosa)}</b> per questo impianto.<br>${esc(serve)}</div>`;
}
function spark(valori, colore){
  const v = valori.filter(x=>x!=null&&!isNaN(x));
  if(v.length<2) return '';
  const mi=Math.min(...v), ma=Math.max(...v), W=280, H=44;
  const pts = v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-(y-mi)/((ma-mi)||1)*(H-4)-2).toFixed(1)}`);
  return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${colore||'var(--oak)'}" stroke-width="1.5"/></svg>`;
}
</script>

async function apriFrame(id, percorso){
  const el=document.getElementById('fr-'+id);
  if(!percorso){ el.textContent='solo grezzo radiometrico, nessuna immagine'; return; }

  const u = await firma('termico-rgb', percorso);
  el.innerHTML = u ? `<img src="${esc(u)}" alt="fotogramma termico">` : 'file non raggiungibile';
}

  const ordine=Object.values(filaDi);
  if(ordine.length>1){
    const pts=[]; ordine.forEach((id,i)=>{const r=mappa.find(m=>m.filare_id===id);
      if(!r)return; pts.push(`${px(r.y0)},${py(i%2?lung:0)}`,`${px(r.y0)},${py(i%2?0:lung)}`);});
    f.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="#6fd3a0"
      stroke-width="1" stroke-dasharray="3 4" opacity=".35"/>`);
  }
  mappa.forEach(r=>{
    const col=(COLORI[r.stato]||COLORI['mai pulito']).c;
    f.push(`<rect id="f-${r.filare_id}" x="${px(r.y0)-larg/2}" y="${py(0)}"
      width="${larg}" height="${py(lung)-py(0)}" rx="1.5" fill="${col}" opacity=".85">
      <title>${r.filare_id} · ${r.stato} · ${r.m2} m²${r.giorni_da_pulizia!=null?
        ' · pulito '+r.giorni_da_pulizia+' gg fa':''}${r.difetti_aperti?
        ' · '+r.difetti_aperti+' difetti':''}</title></rect>`);
    if(r.difetti_aperti>0) f.push(`<circle cx="${px(r.y0)}" cy="${py(0)-6}" r="2.4" fill="#d9534f"/>`);
  });
  f.push(`<circle cx="${MX-14}" cy="${py(lung)+4}" r="5" fill="none" stroke="#4ea87b" stroke-width="1.5"/>
    <text x="${MX-26}" y="${py(lung)+18}" fill="#4ea87b" font-size="9">base</text>`);
  f.push(`<circle id="pacqua" cx="${MX-14}" cy="${py(lung/2)}" r="5" fill="none" stroke="#3f8fd9" stroke-width="1.5"/>
    <text x="${MX-26}" y="${py(lung/2)+16}" fill="#3f8fd9" font-size="9">acqua</text>`);
  f.push(`<polyline id="scia" fill="none" stroke="#6fd3a0" stroke-width="1" opacity=".35"/>`);
  f.push(`<g id="rc01"><circle r="5" fill="#6fd3a0"/>
     <text y="-8" fill="#6fd3a0" font-size="9" text-anchor="middle">RC-01</text></g>`);
  const svg=$('#campoSvg'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=f.join('');
  const c={}; mappa.forEach(r=>c[r.stato]=(c[r.stato]||0)+1);
  if($('#legenda')) $('#legenda').innerHTML = Object.keys(COLORI).filter(s=>c[s])
    .map(s=>`<div class="leg"><span class="q" style="background:${COLORI[s].c}"></span>
      ${COLORI[s].n} <b style="color:var(--testo)">${c[s]}</b></div>`).join('')
    + `<div class="leg" style="margin-left:auto">tratteggio = il giro di stanotte · pallino rosso = difetto</div>`;
  if($('#vel')) disegnaVel();
  if($('#via')) $('#via').onclick=()=>{ if(k>=TR.n-1){k=0;scia.length=0;disegnaCampo();} va=!va;
    $('#via').textContent = va?'⏸ Pausa':'▶ Riproduci'; };
  if($('#barra')) $('#barra').oninput=e=>{ va=false; k=+e.target.value; scia.length=0; mostra(k); };
}
function disegnaVel(){
  $('#vel').innerHTML=[1,4,8,20].map(v=>
    `<button class="${v===velocita?'sel':''}" onclick="setVel(${v})">${v}×</button>`).join('');
}
function setVel(v){ velocita=v; if($('#vel')) disegnaVel(); }

function disegnaFianco(i){
  const svg=$('#fiancoSvg'); if(!svg) return;
  const W=1000,H=290;
  const x=TR.x[i]||0, q=TR.quota[i]||1.8, rollio=TR.rollio[i]||0;
  const terreno=(TR.terreno[i]||0)/1000, forza=TR.forza[i], polsoMm=TR.polso[i]||0;
  const oltre=TR.oltre[i]||0, cont=TR.contatto[i], ant=TR.anticipo[i];
  const sasso=TR.sasso_mm[i]||0, rullo=TR.rullo[i]||0, v=TR.v[i]||0;
  const vetroY=1.44, SC=84, suolo=H-70, m2px=m=>m*SC, cx=300;
  const pts=[];
  for(let d=-3.2; d<=6.2; d+=0.08){
    const xx=x+d; let h=0.025*Math.sin(2*Math.PI*xx/3.5);
    (TR.sassi||[]).forEach(([sx,alt])=>{ if(Math.abs(xx-sx)<0.05)
      h += alt*Math.pow(Math.cos(Math.PI*(xx-sx)/0.10),2); });
    pts.push(`${(cx+m2px(d)).toFixed(1)},${(suolo-m2px(h)).toFixed(1)}`);
  }
  const f=[`<rect width="${W}" height="${H}" fill="#080c11"/>`];
  f.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="#3d3226" stroke-width="2"/>`);
  f.push(`<rect x="0" y="${suolo}" width="${W}" height="${H-suolo}" fill="#241d15" opacity=".55"/>`);
  const vy=suolo-m2px(vetroY);
  f.push(`<rect x="${cx+m2px(1.0)}" y="${vy-3}" width="${m2px(3.2)}" height="6" rx="2"
     fill="#2a4a6a" opacity=".9"/>
     <text x="${cx+m2px(2.6)}" y="${vy-10}" fill="#4a7ba8" font-size="10" text-anchor="middle">
     modulo · il vetro sta fermo</text>`);
  const cy=suolo-m2px(0.32+terreno);
  f.push(`<g transform="translate(${cx},${cy}) rotate(${rollio})">
    <rect x="${-m2px(0.9)}" y="${-m2px(0.30)}" width="${m2px(1.8)}" height="${m2px(0.42)}"
      rx="4" fill="#1e2731" stroke="#3a4756"/>
    <rect x="${-m2px(0.95)}" y="${m2px(0.12)}" width="${m2px(1.9)}" height="${m2px(0.20)}"
      rx="5" fill="#151c24" stroke="#2c3846"/>
    <text x="0" y="${-m2px(0.10)}" fill="#6b7887" font-size="9" text-anchor="middle">rover</text></g>`);
  if(Math.abs(rollio)>0.05)
    f.push(`<text x="${cx}" y="${cy+m2px(0.62)}" fill="#d99a2b" font-size="10" text-anchor="middle">
      rollio ${rollio.toFixed(2)}° · ×${(TR.sbraccio_m/TR.carreggiata_m).toFixed(1)} alla testa</text>`);
  const perno={x:cx,y:cy-m2px(0.30)}, testa={x:cx+m2px(TR.sbraccio_m||2.18),y:suolo-m2px(q)};
  f.push(`<line x1="${perno.x}" y1="${perno.y}" x2="${testa.x}" y2="${testa.y}"
    stroke="${ant?'#d99a2b':'#5b6a7c'}" stroke-width="7" stroke-linecap="round"/>
    <circle cx="${perno.x}" cy="${perno.y}" r="5" fill="#3a4756"/>`);
  const colTesta = cont ? (forza>F_LIMITE?'#d9534f':forza>48?'#d99a2b':'#6fd3a0') : '#5b6a7c';
  f.push(`<circle cx="${testa.x}" cy="${testa.y}" r="9" fill="${colTesta}"/>`);
  if(rullo>10) f.push(`<circle cx="${testa.x}" cy="${testa.y}" r="13" fill="none"
    stroke="${colTesta}" stroke-width="1.5" opacity=".5" stroke-dasharray="4 3"/>`);
  f.push(`<text x="${testa.x}" y="${testa.y-20}" fill="${colTesta}" font-size="11"
    text-anchor="middle">${forza!=null?forza.toFixed(1)+' N':'—'}</text>`);
  const bx=testa.x+26, bh=72;
  const usato=Math.min(1,Math.max(0,(polsoMm-LAVORO_MM)/DISPONIBILE));
  const colBar = oltre>0?'#d9534f':usato>0.85?'#d99a2b':'#6fd3a0';
  f.push(`<rect x="${bx}" y="${testa.y-bh/2}" width="10" height="${bh}" rx="3" fill="#151c24" stroke="#2c3846"/>
    <rect x="${bx+1}" y="${testa.y-bh/2+1+(bh-2)*(1-usato)}" width="8" height="${(bh-2)*usato}" rx="2" fill="${colBar}"/>
    <text x="${bx+5}" y="${testa.y-bh/2-6}" fill="#7d8896" font-size="9" text-anchor="middle">polso</text>
    <text x="${bx+5}" y="${testa.y+bh/2+13}" fill="${colBar}" font-size="9" text-anchor="middle">${
      Math.max(0,polsoMm-LAVORO_MM).toFixed(0)}/${DISPONIBILE} mm</text>`);
  if(oltre>0) f.push(`<text x="${bx+5}" y="${testa.y+bh/2+26}" fill="#d9534f" font-size="9"
    text-anchor="middle">IN BATTUTA ${oltre.toFixed(0)} mm</text>`);
  const l0=cx+m2px(0.5), l1=cx+m2px(3.0), ly=cy-m2px(0.1);
  f.push(`<path d="M ${cx} ${ly} L ${l0} ${suolo-m2px(0.02)} L ${l1} ${suolo-m2px(0.02)} Z"
     fill="${ant?'#d99a2b':'#3f8fd9'}" opacity="${ant?.16:.07}"/>
    <text x="${(l0+l1)/2}" y="${suolo+16}" fill="${ant?'#d99a2b':'#3f8fd9'}" font-size="9"
     text-anchor="middle">LiDAR · profila il terreno da 0,5 a 3,0 m</text>`);
  if(ant) f.push(`<text x="${(l0+l1)/2}" y="${suolo+30}" fill="#d99a2b" font-size="11"
    text-anchor="middle">⚠ gradino ${sasso.toFixed(0)} mm davanti — braccio ALZATO in anticipo</text>`);
  f.push(`<text x="14" y="20" fill="#7d8896" font-size="10">${v.toFixed(2)} m/s · vista di fianco, scala reale</text>
    <line x1="14" y1="30" x2="${14+m2px(1)}" y2="30" stroke="#3a4756" stroke-width="2"/>
    <text x="${14+m2px(0.5)}" y="43" fill="#7d8896" font-size="9" text-anchor="middle">1 m</text>`);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=f.join('');
}

function mostra(i){
  if(quadro!=='campo' || !PX || !$('#campoSvg')) return;
  const x=TR.x[i], fila=TR.fila[i], modo=TR.modo[i];
  const r = fila ? mappa.find(m=>m.filare_id===(filaDi[fila]||fila)) : null;
  const cy=PX.py(Math.max(0,Math.min(PX.lung,x)));
  const cx = r ? PX.px(r.y0) : PX.px(mappa[0].y0)-14;
  const g=document.getElementById('rc01'); if(g) g.setAttribute('transform',`translate(${cx},${cy})`);
  scia.push(`${cx.toFixed(1)},${cy.toFixed(1)}`); if(scia.length>900) scia.shift();
  const s=document.getElementById('scia'); if(s) s.setAttribute('points',scia.join(' '));
  const pa=document.getElementById('pacqua'); if(pa) pa.setAttribute('fill', modo==='RIFORNIMENTO'?'#3f8fd9':'none');
  TR.eventi.filter(e=>e.tipo==='fila'&&e.t<=TR.t[i]&&e.testo.endsWith(': ok'))
    .forEach(e=>{ const el=document.getElementById('f-'+(filaDi[e.testo.split(':')[0]]||''));
      if(el){ el.setAttribute('fill','#6fd3a0'); el.setAttribute('opacity','1'); }});
  disegnaFianco(i); disegnaDice(i); disegnaFlotta(i); disegnaDecisioni();
  if($('#ora')) $('#ora').textContent = mmss(TR.t[i]);
  if($('#quanto')) $('#quanto').textContent = `${i+1}/${TR.n}`;
  if($('#barra')) $('#barra').value = i;
  if($('#eventi')) $('#eventi').innerHTML = TR.eventi.filter(e=>e.t<=TR.t[i]).slice(-14).reverse()
    .map(e=>`<div class="evento"><b>${mmss(e.t).substr(3)}</b>
      <span style="color:${e.tipo==='impedimento'||e.tipo==='anticipo'?'var(--warn)':
        e.tipo==='acqua'||e.tipo==='sospesa'?'var(--acqua)':'var(--testo)'}">${esc(e.testo)}</span></div>`).join('')
    || '<div style="color:var(--tenue)">—</div>';
}

function disegnaDice(i){
  if(!$('#dice')) return;
  const modo=TR.modo[i], fila=TR.fila[i], x=TR.x[i]||0, v=TR.v[i]||0;
  const lung=TR.lunghezza_fila_m||90.5, canc=TR.cancello[i], perche=TR.perche[i], ant=TR.anticipo[i];
  const nome=filaDi[fila]||fila;
  let t = COSA[modo]||modo;
  if(modo==='CLEAN'&&nome) t = `sta pulendo la fila <b>${esc(nome)}</b>`;
  if(ant) t = `⚠ <b>braccio alzato</b>: c'è un gradino da ${TR.sasso_mm[i].toFixed(0)} mm davanti`;
  if(canc) t = `<b style="color:var(--warn)">${esc(canc)}</b> — ${esc(perche)}`;
  $('#dice').innerHTML = t;
  const resta=Math.max(0,lung-x);
  $('#dicePos').textContent = (modo==='CLEAN'&&v>0.01)
    ? `${x.toFixed(0)} m su ${lung.toFixed(0)} · ${v.toFixed(2)} m/s · mancano ${(resta/v/60).toFixed(0)} min`
    : `${v.toFixed(2)} m/s`;
}

function disegnaFlotta(i){
  if(!$('#flotta')) return;
  const batt=TR.batt[i], acqua=TR.acqua[i], forza=TR.forza[i];
  const modo=TR.modo[i], fila=TR.fila[i], m2=TR.m2[i];
  const canc=TR.cancello[i], perche=TR.perche[i];
  const chiuse=TR.eventi.filter(e=>e.tipo==='fila'&&e.t<=TR.t[i]&&e.testo.endsWith(': ok'));
  const fatti=chiuse.reduce((s,e)=>s+(mappa.find(f=>f.filare_id===filaDi[e.testo.split(':')[0]])||{m2:0}).m2,0);
  const daFare=Object.keys(filaDi).length;
  const lavora=['CLEAN','DEPLOY','RETRACT','TRANSFER'].includes(modo);
  const massa=M_VUOTO+(acqua||0), util=massa-M_VEICOLO;
  const b=(v,max,col)=>`<div class="barra"><i style="width:${Math.min(100,v/max*100)}%;background:${col}"></i></div>`;
  let h=`<div class="rover ${lavora?'attivo':''}">
    <div class="rtesta"><b>RC-01</b>
      <span class="pill" style="background:#2a2114;color:#e8c88a">registrata</span>
      <span class="pill ${canc?'male':lavora?'ok':''}">${esc(modo)}</span>
      <span style="color:var(--tenue);font-size:11.5px;margin-left:auto">${esc(filaDi[fila]||fila||'—')}</span></div>
    <div class="carico"><span>batteria</span>${b(batt||0,100,(batt||0)<25?'var(--bad)':'var(--oak)')}<b>${num(batt,0)}%</b></div>
    <div class="carico"><span>acqua</span>${b(acqua||0,SERB,'var(--acqua)')}<b>${num(acqua,0)} L</b></div>
    <div class="carico"><span>massa</span>${b(massa,M_LIMITE,massa>M_LIMITE?'var(--bad)':'var(--oak)')}<b>${num(massa)} kg</b></div>
    <div class="carico"><span>carico ut.</span>${b(util,PAYLOAD,util>PAYLOAD?'var(--bad)':util>PAYLOAD*.9?'var(--warn)':'var(--oak)')}<b>${num(100*util/PAYLOAD)}%</b></div>
    <div class="carico"><span>forza</span>${b(forza||0,F_LIMITE,(forza||0)>F_LIMITE?'var(--bad)':(forza||0)>48?'var(--warn)':'var(--oak)')}<b>${num(forza,1)} N</b></div>
    <div class="carico"><span>questa fila</span>${b(m2||0,181,'#2d6349')}<b>${num(m2)} m²</b></div>
    <div class="carico"><span>stanotte</span>${b(chiuse.length,daFare||1,'var(--oak)')}<b>${chiuse.length}/${daFare}</b></div>
    ${canc?`<div style="margin-top:7px;font-size:11.5px;color:var(--warn)"><b>${esc(canc)}</b> · ${esc(perche)}</div>`:''}
    <div class="nota">massa a vuoto ${num(M_VUOTO)} kg · limite RF-04 ${num(M_LIMITE)} kg ·
      carico utile ${num(PAYLOAD)} kg. A serbatoio pieno si sta all'88%:
      <b>l'acqua è quasi tutto il carico utile</b>.</div></div>`;
  rover.forEach(x=>{
    const vivo = x.da_quanto_muto_min!=null && N(x.da_quanto_muto_min) < 15;
    if(vivo){
      const acq=N(x.acqua_a_bordo_l)||0, m=M_VUOTO+acq;
      h+=`<div class="rover attivo"><div class="rtesta"><b>${esc(x.robot_id)}</b>
        <span class="pill ok">${esc(x.mode||x.stato)}</span>
        <span style="color:var(--tenue);font-size:11.5px;margin-left:auto">${esc(x.filare_corrente||'—')} · ${num(x.da_quanto_muto_min,0)}′ fa</span></div>
        <div class="carico"><span>acqua</span>${b(acq,400,'var(--acqua)')}<b>${num(acq)} L</b></div>
        <div class="carico"><span>massa</span>${b(m,M_LIMITE,m>M_LIMITE?'var(--bad)':'var(--oak)')}<b>${num(m)} kg</b></div>
        <div class="carico"><span>fatti</span>${b(N(x.m2_nella_missione)||0,1500,'var(--oak)')}<b>${num(x.m2_nella_missione)} m²</b></div></div>`;
    } else {
      h+=`<div class="rover"><div class="rtesta"><b>${esc(x.robot_id)}</b>
        <span class="pill ${/ARRESTO|muto|mai sentito/.test(x.stato||'')?'male':''}">${esc(x.stato)}</span></div>
        <div style="font-size:11.5px;color:var(--tenue)">${esc(x.esito_ultima_notte||'nessun rapporto')}</div></div>`;
    }
  });
  $('#flotta').innerHTML=h;
}

function disegnaDecisioni(){
  const e=$('#decisioni'); if(!e) return;
  if(!decisioni.length){ e.innerHTML='<div class="vuoto">Nessuna decisione registrata.</div>'; return; }
  e.innerHTML = decisioni.slice(0,3).map(d=>`
    <div class="decisione">
      <div class="k">${esc(d.kind)} <span style="color:var(--tenue);font-size:10.5px">· ${dataora(d.ts)}</span></div>
      ${d.perche?`<div style="font-size:12.5px;margin-top:5px">${esc(d.perche)}</div>`:''}
      ${d.ha_scartato?`<div class="s">ha scartato <b>${esc(d.ha_scartato)}</b><br>${esc(d.perche_scartata||'')}</div>`:''}
      ${d.verdetto?`<div class="s" style="color:var(--oak)">giudicata <b>${esc(d.verdetto)}</b> da ${esc(d.giudicata_da)}</div>`
        :`<div class="giud">
           <button class="si" onclick="giudica(${d.decision_id},'giusta')">✅</button>
           <button class="no" onclick="giudica(${d.decision_id},'sbagliata')">❌</button>
           <button class="forse" onclick="giudica(${d.decision_id},'da_rivedere')">🤔</button></div>`}
    </div>`).join('');
}
async function giudica(id,v){
  const nota = prompt('Perché — e soprattutto cosa andava fatto:') || null;
  const r = await rpc('giudica_decisione',{p_decision_id:id,p_verdetto:v,p_nota:nota,p_cosa_andava_fatto:nota});
  if(r&&r.esito==='registrato') carica(); else alert('Non registrato: '+((r&&r.motivo)||'errore'));
}

function giro(ts){
  if(va && quadro==='campo'){ const dt=(ts-ultimo)/1000; ultimo=ts; k += dt*velocita;
    if(k>=TR.n){ k=TR.n-1; va=false; if($('#via')) $('#via').textContent='↻ Da capo'; }
    mostra(Math.floor(k)); } else ultimo=ts;
  requestAnimationFrame(giro);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&$('#login').style.display!=='none') entra();
  if(quadro!=='campo'||$('#app').style.display==='none') return;
  if(e.key===' '&&$('#via')){ e.preventDefault(); $('#via').onclick(); }
  if(e.key==='ArrowRight'){ va=false; k=Math.min(TR.n-1,k+5); mostra(Math.floor(k)); }
  if(e.key==='ArrowLeft'){ va=false; k=Math.max(0,k-5); mostra(Math.floor(k)); }
});
</script>
</html>
